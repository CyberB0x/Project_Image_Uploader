<!-- Главная - Image Hosting -->
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Главная - Image Hosting</title>
    <link rel="stylesheet" href="styles-main.css">
</head>
<body>
<div>
    <header class="hero-header">
        <h1>Upload Photos</h1>
        <p>Upload selfies, memes, or any fun pictures here.</p>
        <div class="button-group">
            <a href="/upload/" class="hero-button">Take me to Showcase</a>
        </div>
    </header>

    <section class="hero-section">
        <img id="heroImage" src="https://picsum.photos/300" alt="Hero Image">
    </section>

    <section class="gallery">
        <img src="https://picsum.photos/150?random=1" alt="User Image 1" style="animation-delay: 0.2s;">
        <img src="https://picsum.photos/150?random=2" alt="User Image 2" style="animation-delay: 0.4s;">
        <img src="https://picsum.photos/150?random=3" alt="User Image 3" style="animation-delay: 0.6s;">
        <img src="https://picsum.photos/150?random=4" alt="User Image 4" style="animation-delay: 0.8s;">
    </section>
</div>

</body>
</html>
